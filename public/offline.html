<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>অফলাইন — বাংলার ভয়েস</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1e8;color:#111;
        font-family:"Hind Siliguri",system-ui,sans-serif;padding:24px}
      .card{border:3px solid #111;background:#fff;box-shadow:6px 6px 0 0 #111;padding:24px;max-width:420px;text-align:center}
      h1{margin:0 0 8px;font-size:1.4rem}
      a{display:inline-block;margin-top:16px;border:3px solid #111;padding:8px 14px;text-decoration:none;color:#111;font-weight:700}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>ইন্টারনেট সংযোগ নেই</h1>
      <p>আপনি অফলাইনে আছেন। সংযোগ ফিরে এলে সর্বশেষ খবর আবার লোড হবে।</p>
      <a href="/">আবার চেষ্টা করুন</a>
    </div>
  </body>
</html>
